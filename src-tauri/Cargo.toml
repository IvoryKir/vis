[package]
name = "vis-desktop"
version = "0.0.1"
description = "OpenCode Visualizer — desktop shell"
authors = ["xenodrive", "IvoryKir"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` target is what the frontend loads as the Tauri runtime.
[lib]
name = "vis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
